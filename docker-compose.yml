services:
  dj:
    build:
      context: .
      dockerfile: Dockerfile
    image: rnl-dj-bot:latest
    container_name: rnl-dj-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the container these are fixed; everything else comes from .env
      DATA_DIR: /app/data
      PORT: "7403"
    ports:
      # Bound to loopback: Caddy on the host is the only thing that should be
      # able to reach the app. Drop the 127.0.0.1 prefix only if you intend to
      # expose it directly to the internet without a reverse proxy.
      - "127.0.0.1:${PORT:-7403}:7403"
    volumes:
      - dj-data:/app/data
    networks:
      # "default" keeps this stack's own network; "proxy" is the shared network
      # Caddy lives on, which is what lets it resolve rnl-dj-bot:7403.
      #
      # This belongs here rather than in an overlay file precisely so that a
      # plain `docker compose up -d` cannot drop the attachment and leave the
      # site returning 502.
      - default
      - proxy
    # Opus encoding + mixing is CPU bound but light; cap it so a runaway mix
    # cannot starve the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

volumes:
  dj-data:

networks:
  proxy:
    # The pre-existing network the reverse proxy is attached to. Declared
    # external so compose fails fast with a clear message if it is missing,
    # rather than starting an unreachable container.
    #
    # Override for a different proxy setup:  CADDY_NETWORK=my_net docker compose up -d
    # Running with no reverse proxy at all? Delete this block and the service's
    # `networks:` key, and reach the app on 127.0.0.1:7403 directly.
    external: true
    name: ${CADDY_NETWORK:-edge}
