services:
  dj:
    build:
      context: .
      dockerfile: Dockerfile
    image: rnl-dj-bot:latest
    container_name: rnl-dj-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the container these are fixed; everything else comes from .env
      DATA_DIR: /app/data
      PORT: "7403"
    ports:
      # Bound to loopback: Caddy on the host is the only thing that should be
      # able to reach the app. Drop the 127.0.0.1 prefix only if you intend to
      # expose it directly to the internet without a reverse proxy.
      - "127.0.0.1:${PORT:-7403}:7403"
    volumes:
      - dj-data:/app/data
    # Opus encoding + mixing is CPU bound but light; cap it so a runaway mix
    # cannot starve the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

volumes:
  dj-data:
